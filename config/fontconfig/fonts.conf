<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <!-- Default Sans-Serif: Apple SF Pro Display / Text -->
    <match target="pattern">
        <test qual="any" name="family"><string>sans-serif</string></test>
        <edit name="family" mode="prepend" binding="strong">
            <string>SF Pro Display</string>
            <string>SF Pro Text</string>
        </edit>
    </match>

    <!-- Default Sans: Apple SF Pro Display -->
    <match target="pattern">
        <test qual="any" name="family"><string>sans</string></test>
        <edit name="family" mode="prepend" binding="strong">
            <string>SF Pro Display</string>
            <string>SF Pro Text</string>
        </edit>
    </match>

    <!-- Default Monospace: Apple SFMono Nerd Font -->
    <match target="pattern">
        <test qual="any" name="family"><string>monospace</string></test>
        <edit name="family" mode="prepend" binding="strong">
            <string>SFMono Nerd Font</string>
            <string>SF Mono</string>
        </edit>
    </match>

    <!-- Aliases for Helvetica / Arial -> SF Pro Display -->
    <match target="pattern">
        <test name="family"><string>Helvetica</string></test>
        <edit name="family" mode="assign" binding="strong"><string>SF Pro Display</string></edit>
    </match>
    <match target="pattern">
        <test name="family"><string>Arial</string></test>
        <edit name="family" mode="assign" binding="strong"><string>SF Pro Display</string></edit>
    </match>
</fontconfig>
